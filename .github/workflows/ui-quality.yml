name: UI Quality

on:
  workflow_dispatch:
    inputs:
      production_integrity:
        description: "Run read-only production database integrity checks"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 20 * * *"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".autopilot/**"
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
    paths-ignore:
      - ".autopilot/**"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm test

      - name: UI guardrails
        run: pnpm audit:ui

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Production build
        run: pnpm build

      - name: Smoke production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 pnpm start > /tmp/revolt-riders-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ -o /tmp/revolt-riders-home.html; then
              test -s /tmp/revolt-riders-home.html
              exit 0
            fi
            sleep 1
          done

          cat /tmp/revolt-riders-next.log
          exit 1

      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          chromedriver --version

          PORT=3000 pnpm start > /tmp/revolt-riders-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/revolt-riders-browser.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3000 pnpm test:browser

  production_integrity:
    name: production-integrity
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.production_integrity) || (github.event_name == 'push' && github.ref == 'refs/heads/chore/harden-ci-repo-safety-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production database integrity
        run: pnpm test:production-integrity

  dependency_repair:
    name: dependency-repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/harden-ci-repo-safety-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate minimal audited dependency update
        shell: bash
        run: |
          set -euo pipefail

          if grep -q '"next": "16.3.6"' package.json && pnpm audit --prod --audit-level high; then
            echo "Production dependencies already satisfy the security gate."
            exit 0
          fi

          pnpm up next@16.3.6 --save-exact
          pnpm audit --prod --fix=update || true

          if ! pnpm audit --prod --audit-level high; then
            pnpm audit --prod --fix=override || true
          fi

          pnpm install --lockfile-only
          pnpm audit --prod --audit-level high

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml

          if git diff --cached --quiet; then
            echo "No dependency repair changes generated."
            exit 0
          fi

          git commit -m "fix: patch audited production dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
