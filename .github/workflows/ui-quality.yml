name: UI Quality

on:
  workflow_dispatch:
    inputs:
      production_integrity:
        description: "Read-only production DB integrity check (manual only)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths-ignore:
      - ".autopilot/**"
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
    paths-ignore:
      - ".autopilot/**"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm test

      - name: UI guardrails
        run: pnpm audit:ui

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Production build
        run: pnpm build

      - name: Smoke production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 pnpm start > /tmp/revolt-riders-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ -o /tmp/revolt-riders-home.html; then
              test -s /tmp/revolt-riders-home.html
              exit 0
            fi
            sleep 1
          done

          cat /tmp/revolt-riders-next.log
          exit 1
      
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          chromedriver --version
          PORT=3000 pnpm start > /tmp/revolt-riders-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/revolt-riders-browser.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3000 pnpm test:browser

  production_integrity:
    if: github.event_name == 'workflow_dispatch' && inputs.production_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production database integrity
        run: pnpm test:production-integrity
  dependency_lock_repair:
    name: dependency-lock-repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/harden-ci-repo-safety-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Rebuild lockfile against security-patched versions
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify no high or critical production dependency vulnerabilities
        run: pnpm audit --prod --audit-level high
      - name: Commit lockfile only when verified
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches patched constraints"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: lock audited production dependency patches"
          git push origin HEAD:chore/harden-ci-repo-safety-v1
