name: UI Quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm test

      - name: UI guardrails
        run: pnpm audit:ui

      - name: TypeScript
        run: pnpm exec tsc --noEmit
