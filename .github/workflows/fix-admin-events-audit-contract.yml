name: Fix Admin Events Audit Contract

on:
  push:
    branches:
      - fix/admin-events-single-flow-20261007

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move final consistency contract to modular event owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-ui-css.mjs')
          source = path.read_text()
          old = '''  "app/admin/page.tsx": [
    "counts_as_mandatory,official_distance_km",
    "sync_event_official_rides",
    "invalidateRideDerivedCaches",
    'role="status"',
  ],'''
          new = '''  "app/admin/page.tsx": [
    "counts_as_mandatory,official_distance_km",
    'href="/admin/events"',
    'role="status"',
  ],
  "app/admin/events/events-actions.ts": [
    "sync_event_official_rides",
    "syncOfficialRidesIfReady",
  ],
  "app/admin/events/events-screen.tsx": [
    "invalidateAgendaCaches",
    'invalidateCache("riding:")',
    "syncOfficialRidesIfReady",
  ],'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one legacy consistency contract, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          grep -q 'app/admin/events/events-actions.ts' scripts/audit-ui-css.mjs
          grep -q 'app/admin/events/events-screen.tsx' scripts/audit-ui-css.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-ui-css.mjs
          git commit -m "test: align UI audit with modular event lifecycle"
          git push
