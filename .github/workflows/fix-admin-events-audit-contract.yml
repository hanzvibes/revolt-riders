name: Fix Admin Events Audit Contract

on:
  push:
    branches:
      - fix/admin-events-single-flow-20261007

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit contract patch
        run: python3 scripts/patch-admin-events-audit.py
      - name: Verify and commit patch
        run: |
          git diff --check
          grep -q 'app/admin/events/events-actions.ts' scripts/audit-ui-css.mjs
          grep -q 'app/admin/events/events-screen.tsx' scripts/audit-ui-css.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-ui-css.mjs
          git commit -m "test: align UI audit with modular event lifecycle"
          git push
