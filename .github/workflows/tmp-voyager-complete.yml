name: Temporary Voyager complete refactor

on:
  push:
    branches:
      - refactor/voyager-complete

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/voyager-complete
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Voyager refactor
        run: python scripts/tmp-voyager-complete.py

      - name: Normalize Voyager manage form state lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manage_path = Path("app/voyager/voyager-manage-sheet.tsx")
          manage = manage_path.read_text()
          manage = manage.replace(
              'import { useEffect, useMemo, useState, type ChangeEvent } from "react";',
              'import { useMemo, useState, type ChangeEvent } from "react";',
              1,
          )
          manage = manage.replace(
              '  const [countsAsMandatory, setCountsAsMandatory] = useState(false);',
              '  const [countsAsMandatory, setCountsAsMandatory] = useState(() => event?.counts_as_mandatory ?? false);',
              1,
          )
          manage = manage.replace(
              '  const [officialDistance, setOfficialDistance] = useState("");',
              '  const [officialDistance, setOfficialDistance] = useState(() =>\n    event?.official_distance_km == null ? "" : String(event.official_distance_km),\n  );',
              1,
          )
          manage = manage.replace(
              '  const [officialSupport, setOfficialSupport] = useState("");',
              '  const [officialSupport, setOfficialSupport] = useState(() => event?.official_support ?? "");',
              1,
          )
          manage = manage.replace(
              '  const [activitySummary, setActivitySummary] = useState("");',
              '  const [activitySummary, setActivitySummary] = useState(() => event?.activity_summary ?? "");',
              1,
          )
          manage = manage.replace(
              '  const [selectedMembers, setSelectedMembers] = useState<string[]>([]);',
              '  const [selectedMembers, setSelectedMembers] = useState<string[]>(() => [...participantIds]);',
              1,
          )
          manage, count = re.subn(
              r'\n  useEffect\(\(\) => \{[\s\S]*?\n  \}, \[event, participantIds\]\);\n',
              '\n',
              manage,
              count=1,
          )
          if count != 1:
              raise SystemExit("Voyager manage initialization effect not found")
          manage_path.write_text(manage)

          page_path = Path("app/voyager/page.tsx")
          page = page_path.read_text()
          old = '      <VoyagerManageSheet\n        event={manageEvent}'
          new = '      <VoyagerManageSheet\n        key={manageEvent?.id ?? "closed"}\n        event={manageEvent}'
          if old not in page:
              raise SystemExit("VoyagerManageSheet mount point not found")
          page_path.write_text(page.replace(old, new, 1))
          PY

      - name: Align Voyager accessibility audit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/audit-ui-css.mjs")
          source = path.read_text()
          marker = "const mobileA11yContracts = {"
          if marker not in source:
              raise SystemExit("mobile accessibility contract map not found")
          head, tail = source.split(marker, 1)
          old = '"app/voyager/page.tsx": ['
          new = '"app/voyager/voyager-manage-sheet.tsx": ['
          if old not in tail:
              raise SystemExit("Voyager mobile accessibility contract not found")
          tail = tail.replace(old, new, 1)
          path.write_text(head + marker + tail)
          PY

      - name: Contract tests
        run: pnpm test

      - name: UI guardrails
        run: pnpm audit:ui

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Smoke production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 pnpm start > /tmp/revolt-riders-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ -o /tmp/revolt-riders-home.html; then
              test -s /tmp/revolt-riders-home.html
              break
            fi
            sleep 1
          done

          test -s /tmp/revolt-riders-home.html || (cat /tmp/revolt-riders-next.log && exit 1)

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(voyager): complete feature modularization"
          git push origin HEAD:refactor/voyager-complete
