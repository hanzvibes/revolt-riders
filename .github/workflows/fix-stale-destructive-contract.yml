name: Fix Stale Destructive Contract

on:
  push:
    branches:
      - fix/admin-events-single-flow-20261007

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point event dialog contracts at modular events screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/production-contract.test.mjs')
          source = path.read_text()
          old = '    "app/admin/events/page.tsx",\n    "app/admin/page.tsx",\n    "app/garage/page.tsx",'
          new = '    "app/admin/events/events-screen.tsx",\n    "app/admin/page.tsx",\n    "app/garage/page.tsx",'
          if source.count(old) != 2:
              raise SystemExit(f'expected two event dialog file-list matches, got {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          test "$(grep -c 'app/admin/events/events-screen.tsx' tests/production-contract.test.mjs)" -ge 2
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/production-contract.test.mjs
          git commit -m "test: target modular event delete dialog"
          git push
