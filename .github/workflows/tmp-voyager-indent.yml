name: Temporary Voyager indent cleanup

on:
  push:
    branches:
      - refactor/voyager-phase-1b

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'voyager-indent-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/voyager-phase-1b
          fetch-depth: 0
      - name: Normalize focused loader block
        run: |
          python - <<'PY'
          from pathlib import Path
          page_path = Path('app/voyager/page.tsx')
          page = page_path.read_text()
          old = '''      const year = new Date().getFullYear();
          const cacheKey = `voyager:${activeAccount.member_external_id}:${year}`;

          const snapshot = await fetchWithCache<VoyagerSnapshot>(
            cacheKey,
            () => fetchVoyagerSnapshot(activeAccount.member_external_id, year),
            { ttlMs: 90_000, forceRefresh },
          );'''
          unindented = '''      const year = new Date().getFullYear();
const cacheKey = `voyager:${activeAccount.member_external_id}:${year}`;

const snapshot = await fetchWithCache<VoyagerSnapshot>(
  cacheKey,
  () => fetchVoyagerSnapshot(activeAccount.member_external_id, year),
  { ttlMs: 90_000, forceRefresh },
);'''
          if unindented in page:
              page = page.replace(unindented, old, 1)
          elif old not in page:
              raise SystemExit('Voyager loader block shape changed')
          page_path.write_text(page)
          Path('.github/workflows/tmp-voyager-indent.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/voyager/page.tsx .github/workflows/tmp-voyager-indent.yml
          git commit -m "style(voyager): normalize snapshot loader indentation"
          git push origin HEAD:refactor/voyager-phase-1b
