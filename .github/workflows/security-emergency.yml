name: Security Emergency Remediation

on:
  push:
    branches:
      - fix/security-emergency-20261007
    paths:
      - ".github/workflows/security-emergency.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Write repository security regression tests
        shell: bash
        run: |
          cat > tests/repository-security.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { access, readFile } from "node:fs/promises";
          import { constants } from "node:fs";
          import test from "node:test";

          const rootUrl = new URL("../", import.meta.url);
          const privatePaths = [
            "DataMember.md",
            "members.csv",
            "public/members_import.csv",
          ];

          async function exists(path) {
            try {
              await access(new URL(path, rootUrl), constants.F_OK);
              return true;
            } catch {
              return false;
            }
          }

          function versionTuple(value) {
            const match = String(value).match(/(\d+)\.(\d+)\.(\d+)/);
            assert.ok(match, `Cannot parse semantic version from ${value}`);
            return match.slice(1).map(Number);
          }

          function isAtLeast(actual, minimum) {
            for (let index = 0; index < 3; index += 1) {
              if (actual[index] > minimum[index]) return true;
              if (actual[index] < minimum[index]) return false;
            }
            return true;
          }

          test("private member source files are not tracked or shipped", async () => {
            for (const path of privatePaths) {
              assert.equal(await exists(path), false, `${path} must not exist in the repository tree`);
            }
          });

          test("private member source paths stay ignored", async () => {
            const ignore = await readFile(new URL(".gitignore", rootUrl), "utf8");
            for (const path of ["/DataMember.md", "/members.csv", "/public/members_import.csv", "/private-data/"]) {
              assert.ok(ignore.split(/\r?\n/).includes(path), `${path} must be ignored`);
            }
          });

          test("Next.js stays on a patched release for GHSA-vcvr-r3jv-pc5j", async () => {
            const pkg = JSON.parse(await readFile(new URL("package.json", rootUrl), "utf8"));
            const actual = versionTuple(pkg.dependencies.next);
            assert.ok(isAtLeast(actual, [16, 3, 6]), `next ${pkg.dependencies.next} is below patched 16.3.6`);
          });
          EOF

      - name: Verify RED state
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/repository-security.test.mjs; then
            echo "Security regression test unexpectedly passed before remediation."
            exit 1
          fi
          echo "RED confirmed: the regression test catches the current exposure/version."

      - name: Remove exposed member source data
        shell: bash
        run: |
          set -euo pipefail
          rm -f DataMember.md members.csv public/members_import.csv
          cat >> .gitignore <<'EOF'

          # Private member source data must never be committed or shipped publicly.
          /DataMember.md
          /members.csv
          /public/members_import.csv
          /private-data/
          EOF

      - name: Patch Next.js dependency
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies.next = "16.3.6";
          pkg.devDependencies["eslint-config-next"] = "16.3.6";
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify GREEN security regression
        run: node --test tests/repository-security.test.mjs

      - name: Install patched dependency graph
        run: pnpm install --frozen-lockfile

      - name: Full contract tests
        run: pnpm test

      - name: UI guardrails
        run: pnpm audit:ui

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Remove one-time workflow and validate diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/security-emergency.yml
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove member PII and patch Next.js"
          git push origin HEAD:fix/security-emergency-20261007
