name: Join Requests Refactor V5

on:
  push:
    branches:
      - feat/join-requests-modularization-v5
    paths:
      - ".github/workflows/join-requests-refactor-v5.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/join-requests-modularization-v5
          fetch-depth: 0

      - name: Extract Join Requests modules
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path("app/admin/join-requests")
          screen_path = root / "join-requests-screen.tsx"
          text = screen_path.read_text()

          text = text.replace('import { getSupabaseBrowserClient } from "@/lib/supabase/client";\n', '')
          text = text.replace(
              'import { useCallback, useEffect, useMemo, useState } from "react";\n\n',
              'import { useCallback, useEffect, useMemo, useState } from "react";\n'
              'import { acceptJoinRequest, activateJoinRequest, rejectJoinRequest } from "./join-requests-actions";\n'
              'import { fetchJoinRequestsSnapshot } from "./join-requests-data";\n'
              'import {\n'
              '  filterJoinRequests,\n'
              '  getInitials,\n'
              '  getJoinRequestCounts,\n'
              '  type JoinRequest,\n'
              '  type JoinRequestsSnapshot,\n'
              '  type JoinRequestTab,\n'
              '  type JoinRequestToast,\n'
              '} from "./join-requests-model";\n'
              'import { getConfirmationLink, getStatusBadge, getWhatsAppLink } from "./join-requests-view";\n\n'
          )

          text, count = re.subn(
              r'type JoinRequest = \{.*?\n\};\ntype JoinRequestsSnapshot = \{.*?\n\};\n\nconst getInitials = \(name: string\) => \{.*?\n\};\n\n',
              '',
              text,
              flags=re.S,
          )
          assert count == 1, f"model extraction matched {count} blocks"

          text = text.replace(
              '  const [tab, setTab] = useState<"all" | "pending" | "accepted" | "confirmed" | "active" | "archived">("pending");',
              '  const [tab, setTab] = useState<JoinRequestTab>("pending");',
          )
          text = text.replace(
              '  const [toast, setToast] = useState<{ text: string; type: "success" | "error" } | null>(null);',
              '  const [toast, setToast] = useState<JoinRequestToast | null>(null);',
          )

          load_start = text.index('  // Load Data\n')
          effect_start = text.index('  useEffect(() => {\n    if (isStaff)', load_start)
          load_block = '''  // Load Data\n  const loadRequests = useCallback(async (forceRefresh = false) => {\n    try {\n      setLoading(true);\n      setError(\"\");\n\n      const snapshot = await fetchWithCache<JoinRequestsSnapshot>(\n        \"admin:join-requests\",\n        fetchJoinRequestsSnapshot,\n        { ttlMs: 30_000, forceRefresh },\n      );\n\n      setRequests(snapshot.requests);\n      setSuggestedMemberId(snapshot.suggestedMemberId);\n      setCustomMemberId((current) => current || snapshot.suggestedMemberId);\n    } catch (err) {\n      const rawMsg = (err as { message?: string })?.message || \"\";\n      if (rawMsg.includes(\"join_requests\") || rawMsg.includes(\"schema cache\")) {\n        setError(\n          \"Tabel join_requests belum dibuat di Supabase. Silakan jalankan file migrasi 20260918000300_add_join_requests_and_public_landing.sql di SQL Editor Supabase.\",\n        );\n      } else if (rawMsg) {\n        setError(rawMsg);\n      } else {\n        setError(\"Gagal memuat data pendaftaran.\");\n      }\n    } finally {\n      setLoading(false);\n    }\n  }, [fetchWithCache]);\n\n'''
          text = text[:load_start] + load_block + text[effect_start:]

          derived_start = text.index('  // Status counts\n')
          actions_start = text.index('  // Actions\n', derived_start)
          derived_block = '''  // Derived view data\n  const counts = useMemo(() => getJoinRequestCounts(requests), [requests]);\n\n  const filteredRequests = useMemo(\n    () => filterJoinRequests(requests, tab, search),\n    [requests, tab, search],\n  );\n\n'''
          text = text[:derived_start] + derived_block + text[actions_start:]

          actions_start = text.index('  // Actions\n')
          helpers_start = text.index('  // WhatsApp helpers\n', actions_start)
          actions_block = '''  // Actions\n  const handleAccept = async (item: JoinRequest) => {\n    setActionLoading(true);\n\n    try {\n      await acceptJoinRequest(item.id);\n      showToast(`Pendaftaran ${item.full_name} berhasil disetujui (Accepted).`, \"success\");\n      invalidateCache(\"admin:join-requests\");\n      invalidateCache(\"shell:pending-join-count\");\n      void loadRequests(true);\n    } catch (err) {\n      showToast(\n        err instanceof Error ? err.message : \"Gagal menyetujui pendaftaran.\",\n        \"error\",\n      );\n    } finally {\n      setActionLoading(false);\n    }\n  };\n\n  const handleReject = async () => {\n    if (!rejectItem) return;\n    setActionLoading(true);\n\n    try {\n      await rejectJoinRequest(rejectItem.id, rejectReason);\n      showToast(`Pendaftaran ${rejectItem.full_name} telah ditolak.`, \"success\");\n      setRejectItem(null);\n      setRejectReason(\"\");\n      invalidateCache(\"admin:join-requests\");\n      invalidateCache(\"shell:pending-join-count\");\n      void loadRequests(true);\n    } catch (err) {\n      showToast(\n        err instanceof Error ? err.message : \"Gagal menolak pendaftaran.\",\n        \"error\",\n      );\n    } finally {\n      setActionLoading(false);\n    }\n  };\n\n  const handleActivate = async () => {\n    if (!activateItem) return;\n    const memberIdToAssign = (customMemberId || suggestedMemberId).trim().toUpperCase();\n\n    if (!memberIdToAssign.match(/^RR-\\d{3,}$/)) {\n      showToast(\"Format ID RR harus RR-XXX (contoh: RR-028)\", \"error\");\n      return;\n    }\n\n    setActionLoading(true);\n\n    try {\n      await activateJoinRequest(activateItem.id, memberIdToAssign);\n      showToast(\n        `Member resmi berhasil diaktivasi dengan ID ${memberIdToAssign}!`,\n        \"success\",\n      );\n      setActivateItem(null);\n      invalidateCache(\"admin:join-requests\");\n      invalidateCache(\"shell:pending-join-count\");\n      void loadRequests(true);\n    } catch (err) {\n      showToast(\n        err instanceof Error ? err.message : \"Gagal mengaktivasi member.\",\n        \"error\",\n      );\n    } finally {\n      setActionLoading(false);\n    }\n  };\n\n'''
          text = text[:actions_start] + actions_block + text[helpers_start:]

          helpers_start = text.index('  // WhatsApp helpers\n')
          auth_start = text.index('  if (authLoading) {', helpers_start)
          helpers_block = '''  const copyConfirmationLink = (item: JoinRequest) => {\n    if (!item.confirmation_token) return;\n    const url = getConfirmationLink(item, window.location.origin);\n    if (!url) return;\n    navigator.clipboard.writeText(url);\n    showToast(`Link konfirmasi untuk ${item.full_name} berhasil disalin ke clipboard!`, \"success\");\n  };\n\n'''
          text = text[:helpers_start] + helpers_block + text[auth_start:]
          screen_path.write_text(text)

          (root / 'join-requests-model.ts').write_text('''export type JoinRequestStatus =\n  | \"pending\"\n  | \"accepted\"\n  | \"confirmed\"\n  | \"active\"\n  | \"rejected\"\n  | \"expired\";\n\nexport type JoinRequestTab =\n  | \"all\"\n  | \"pending\"\n  | \"accepted\"\n  | \"confirmed\"\n  | \"active\"\n  | \"archived\";\n\nexport type JoinRequest = {\n  id: string;\n  full_name: string;\n  birth_place: string;\n  birth_date: string;\n  city: string;\n  instagram: string;\n  whatsapp: string;\n  status: JoinRequestStatus;\n  confirmation_token: string | null;\n  accepted_at: string | null;\n  confirmed_at: string | null;\n  activated_at: string | null;\n  rejected_at: string | null;\n  rejection_reason: string | null;\n  assigned_member_id: string | null;\n  created_at: string;\n};\n\nexport type JoinRequestsSnapshot = {\n  requests: JoinRequest[];\n  suggestedMemberId: string;\n};\n\nexport type JoinRequestToast = {\n  text: string;\n  type: \"success\" | \"error\";\n};\n\nexport type JoinRequestCounts = Record<JoinRequestTab, number>;\n\nexport const getInitials = (name: string) => {\n  const parts = name.trim().split(/\\s+/).filter(Boolean);\n  if (parts.length >= 2) {\n    return (parts[0][0] + parts[1][0]).toUpperCase();\n  }\n  return name.slice(0, 2).toUpperCase();\n};\n\nexport const getJoinRequestCounts = (requests: JoinRequest[]): JoinRequestCounts => ({\n  all: requests.length,\n  pending: requests.filter((request) => request.status === \"pending\").length,\n  accepted: requests.filter((request) => request.status === \"accepted\").length,\n  confirmed: requests.filter((request) => request.status === \"confirmed\").length,\n  active: requests.filter((request) => request.status === \"active\").length,\n  archived: requests.filter(\n    (request) => request.status === \"rejected\" || request.status === \"expired\",\n  ).length,\n});\n\nexport const filterJoinRequests = (\n  requests: JoinRequest[],\n  tab: JoinRequestTab,\n  search: string,\n) =>\n  requests.filter((request) => {\n    if (tab === \"pending\" && request.status !== \"pending\") return false;\n    if (tab === \"accepted\" && request.status !== \"accepted\") return false;\n    if (tab === \"confirmed\" && request.status !== \"confirmed\") return false;\n    if (tab === \"active\" && request.status !== \"active\") return false;\n    if (\n      tab === \"archived\" &&\n      request.status !== \"rejected\" &&\n      request.status !== \"expired\"\n    ) {\n      return false;\n    }\n\n    if (!search.trim()) return true;\n\n    const query = search.toLowerCase();\n    return (\n      request.full_name.toLowerCase().includes(query) ||\n      request.city.toLowerCase().includes(query) ||\n      request.whatsapp.includes(query) ||\n      request.instagram.toLowerCase().includes(query) ||\n      Boolean(request.assigned_member_id?.toLowerCase().includes(query))\n    );\n  });\n''')

          (root / 'join-requests-data.ts').write_text('''import { getSupabaseBrowserClient } from \"@/lib/supabase/client\";\nimport type { JoinRequest, JoinRequestsSnapshot } from \"./join-requests-model\";\n\nexport const fetchJoinRequestsSnapshot = async (): Promise<JoinRequestsSnapshot> => {\n  const supabase = getSupabaseBrowserClient();\n  const [requestsResult, profilesResult] = await Promise.all([\n    supabase.from(\"join_requests\").select(\"*\").order(\"created_at\", { ascending: false }),\n    supabase.from(\"member_profiles\").select(\"member_external_id\"),\n  ]);\n\n  if (requestsResult.error) throw requestsResult.error;\n  if (profilesResult.error) throw profilesResult.error;\n\n  let maxNum = 27;\n  for (const profile of profilesResult.data ?? []) {\n    const match = profile.member_external_id?.match(/^RR-(\\d+)$/);\n    if (!match) continue;\n    const value = Number.parseInt(match[1], 10);\n    if (Number.isFinite(value) && value > maxNum) maxNum = value;\n  }\n\n  return {\n    requests: (requestsResult.data ?? []) as JoinRequest[],\n    suggestedMemberId: `RR-${String(maxNum + 1).padStart(3, \"0\")}`,\n  };\n};\n''')

          (root / 'join-requests-actions.ts').write_text('''import { getSupabaseBrowserClient } from \"@/lib/supabase/client\";\n\nexport const acceptJoinRequest = async (requestId: string) => {\n  const { error } = await getSupabaseBrowserClient().rpc(\"accept_join_request\", {\n    p_request_id: requestId,\n  });\n  if (error) throw error;\n};\n\nexport const rejectJoinRequest = async (requestId: string, reason: string) => {\n  const { error } = await getSupabaseBrowserClient().rpc(\"reject_join_request\", {\n    p_request_id: requestId,\n    p_reason: reason.trim() || null,\n  });\n  if (error) throw error;\n};\n\nexport const activateJoinRequest = async (requestId: string, memberId: string) => {\n  const { error } = await getSupabaseBrowserClient().rpc(\"activate_join_request\", {\n    p_request_id: requestId,\n    p_member_id: memberId,\n  });\n  if (error) throw error;\n};\n''')

          (root / 'join-requests-view.tsx').write_text('''import type { ReactNode } from \"react\";\nimport type { JoinRequest, JoinRequestStatus } from \"./join-requests-model\";\n\nexport const getStatusBadge = (status: JoinRequestStatus): ReactNode => {\n  switch (status) {\n    case \"pending\":\n      return <span className=\"join-badge join-badge-pending\">Pending</span>;\n    case \"accepted\":\n      return <span className=\"join-badge join-badge-accepted\">Accepted</span>;\n    case \"confirmed\":\n      return <span className=\"join-badge join-badge-confirmed\">Confirmed</span>;\n    case \"active\":\n      return <span className=\"join-badge join-badge-active\">Active</span>;\n    case \"rejected\":\n      return <span className=\"join-badge join-badge-rejected\">Rejected</span>;\n    case \"expired\":\n      return <span className=\"join-badge join-badge-expired\">Expired</span>;\n  }\n};\n\nexport const getConfirmationLink = (item: JoinRequest, origin: string) =>\n  item.confirmation_token ? `${origin}/join/confirm/${item.confirmation_token}` : null;\n\nexport const getWhatsAppLink = (item: JoinRequest, customMsg?: string) => {\n  let cleanWa = item.whatsapp.replace(/[^0-9]/g, \"\");\n  if (cleanWa.startsWith(\"08\")) cleanWa = \"628\" + cleanWa.slice(2);\n\n  let defaultMsg = `Halo ${item.full_name}, kami dari Pengurus Revolt Riders Situbondo.`;\n\n  if (item.status === \"accepted\" && item.confirmation_token) {\n    const origin = typeof window !== \"undefined\" ? window.location.origin : \"https://revolt-riders.com\";\n    const confirmUrl = getConfirmationLink(item, origin);\n    defaultMsg = `Halo ${item.full_name}! Pendaftaran Anda di Revolt Riders telah DISETUJUI oleh pengurus. Silakan lakukan konfirmasi komitmen bergabung Anda dalam 7 hari melalui tautan resmi berikut:\\n\\n${confirmUrl}\\n\\nSalam Satu Aspal!`;\n  } else if (item.status === \"active\" && item.assigned_member_id) {\n    defaultMsg = `Selamat bergabung ${item.full_name}! Pendaftaran Anda telah DIRESMIKAN. Nomor Anggota (ID RR) resmi Anda adalah: ${item.assigned_member_id}. Silakan masuk ke Portal Member untuk melengkapi profil motor Anda. Salam Satu Aspal!`;\n  }\n\n  return `https://wa.me/${cleanWa}?text=${encodeURIComponent(customMsg || defaultMsg)}`;\n};\n''')

          test_path = Path('tests/join-requests-refactor.test.mjs')
          test_path.write_text('''import assert from \"node:assert/strict\";\nimport { readFile } from \"node:fs/promises\";\nimport test from \"node:test\";\nimport ts from \"typescript\";\n\nconst read = (path) => readFile(new URL(`../${path}`, import.meta.url), \"utf8\");\n\nconst importTsModule = async (path) => {\n  const source = await read(path);\n  const output = ts.transpileModule(source, {\n    compilerOptions: { module: ts.ModuleKind.ESNext, target: ts.ScriptTarget.ES2022 },\n  }).outputText;\n  return import(`data:text/javascript;base64,${Buffer.from(output).toString(\"base64\")}`);\n};\n\nconst request = (overrides = {}) => ({\n  id: \"1\",\n  full_name: \"Rider Satu\",\n  birth_place: \"Situbondo\",\n  birth_date: \"2000-01-01\",\n  city: \"Situbondo\",\n  instagram: \"rider.satu\",\n  whatsapp: \"08123456789\",\n  status: \"pending\",\n  confirmation_token: null,\n  accepted_at: null,\n  confirmed_at: null,\n  activated_at: null,\n  rejected_at: null,\n  rejection_reason: null,\n  assigned_member_id: null,\n  created_at: \"2026-10-06T00:00:00Z\",\n  ...overrides,\n});\n\ntest(\"join requests keeps a stable route entry and modular screen boundary\", async () => {\n  const entry = await read(\"app/admin/join-requests/page.tsx\");\n  const screen = await read(\"app/admin/join-requests/join-requests-screen.tsx\");\n  const data = await read(\"app/admin/join-requests/join-requests-data.ts\");\n  const actions = await read(\"app/admin/join-requests/join-requests-actions.ts\");\n  const view = await read(\"app/admin/join-requests/join-requests-view.tsx\");\n\n  assert.match(entry, /^\"use client\";/);\n  assert.match(entry, /import AdminJoinRequestsScreen from \"\\.\\/join-requests-screen\";/);\n  assert.match(entry, /export default AdminJoinRequestsScreen;/);\n\n  assert.match(screen, /from \"\\.\\/join-requests-model\"/);\n  assert.match(screen, /from \"\\.\\/join-requests-data\"/);\n  assert.match(screen, /from \"\\.\\/join-requests-actions\"/);\n  assert.match(screen, /from \"\\.\\/join-requests-view\"/);\n  assert.doesNotMatch(screen, /accept_join_request|reject_join_request|activate_join_request/);\n  assert.match(screen, /admin:join-requests/);\n  assert.match(screen, /shell:pending-join-count/);\n\n  assert.match(data, /from\(\"join_requests\"\)/);\n  assert.match(data, /from\(\"member_profiles\"\)/);\n  assert.match(actions, /accept_join_request/);\n  assert.match(actions, /reject_join_request/);\n  assert.match(actions, /activate_join_request/);\n  assert.match(actions, /if \(error\) throw error;/);\n  assert.match(view, /join-badge-pending/);\n  assert.match(view, /https:\\/\\/wa\\.me/);\n});\n\ntest(\"join request model handles counts and normal filters\", async () => {\n  const { filterJoinRequests, getJoinRequestCounts } = await importTsModule(\n    \"app/admin/join-requests/join-requests-model.ts\",\n  );\n  const items = [\n    request(),\n    request({ id: \"2\", full_name: \"Budi\", status: \"accepted\" }),\n    request({ id: \"3\", full_name: \"Candra\", status: \"active\", assigned_member_id: \"RR-030\" }),\n  ];\n\n  assert.deepEqual(getJoinRequestCounts(items), {\n    all: 3,\n    pending: 1,\n    accepted: 1,\n    confirmed: 0,\n    active: 1,\n    archived: 0,\n  });\n  assert.deepEqual(filterJoinRequests(items, \"active\", \"RR-030\").map(({ id }) => id), [\"3\"]);\n});\n\ntest(\"join request model handles archived and empty-search edge cases\", async () => {\n  const { filterJoinRequests, getInitials, getJoinRequestCounts } = await importTsModule(\n    \"app/admin/join-requests/join-requests-model.ts\",\n  );\n  const items = [\n    request({ id: \"1\", status: \"rejected\" }),\n    request({ id: \"2\", status: \"expired\" }),\n    request({ id: \"3\", status: \"confirmed\" }),\n  ];\n\n  assert.equal(getJoinRequestCounts(items).archived, 2);\n  assert.deepEqual(filterJoinRequests(items, \"archived\", \"   \").map(({ id }) => id), [\"1\", \"2\"]);\n  assert.equal(getInitials(\"Rider Satu\"), \"RS\");\n  assert.equal(getInitials(\"RR\"), \"RR\");\n});\n\ntest(\"join request action layer keeps RPC errors throwable\", async () => {\n  const actions = await read(\"app/admin/join-requests/join-requests-actions.ts\");\n  assert.equal((actions.match(/if \(error\) throw error;/g) ?? []).length, 3);\n});\n''')
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/join-requests tests/join-requests-refactor.test.mjs
          git commit -m "refactor(join-requests): extract model data actions and view"
          git push origin HEAD:feat/join-requests-modularization-v5
